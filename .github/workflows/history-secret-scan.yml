name: History Secret Scan

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fetch full repository history
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Scan reachable history for credential patterns
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          def run(*args):
              return subprocess.check_output(args, text=True, errors="replace")

          commits = run("git", "rev-list", "--all").splitlines()

          sensitive_path = re.compile(
              r'(^|/)\.env(?:\.|$)|(^|/)\.npmrc$|(^|/)\.pypirc$|'
              r'(^|/).*\.pem$|(^|/).*\.key$|(^|/)id_rsa$|'
              r'(^|/)\.vercel/project\.json$',
              re.I,
          )

          patterns = [
              ("private_key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----", re.I)),
              ("github_token", re.compile(r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b")),
              ("aws_access_key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("openai_key", re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b")),
              ("credential_url", re.compile(r"\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis)://[^:\s/]+:[^@\s/]+@", re.I)),
              ("generic_secret_assignment", re.compile(
                  r"\b(?:API[_-]?KEY|ACCESS[_-]?TOKEN|AUTH[_-]?TOKEN|SECRET|CLIENT[_-]?SECRET|PASSWORD|PRIVATE[_-]?KEY)\b"
                  r"\s*[:=]\s*[\"'\x60]?[A-Za-z0-9_+/=.:-]{12,}",
                  re.I,
              )),
          ]

          placeholder = re.compile(
              r"example|placeholder|changeme|your[_-]?(?:key|token|secret|password)|"
              r"dummy|test[_-]?(?:key|token)|process\.env|github\.token|"
              r"\$\{\{|\$\{|<[^>]+>",
              re.I,
          )

          findings = set()

          paths = run("git", "log", "--all", "--name-only", "--pretty=format:").splitlines()
          for p in paths:
              p = p.strip()
              if p and sensitive_path.search(p):
                  findings.add(("history", p, "sensitive_filename"))

          for sha in commits:
              diff = run(
                  "git", "show", "--format=", "--no-ext-diff", "--unified=0",
                  "--find-renames", sha, "--"
              )
              current_file = "unknown"
              for line in diff.splitlines():
                  if line.startswith("+++ b/"):
                      current_file = line[6:]
                      continue
                  if not line.startswith("+") or line.startswith("+++"):
                      continue
                  added = line[1:]
                  for category, regex in patterns:
                      m = regex.search(added)
                      if m and not placeholder.search(m.group(0)):
                          findings.add((sha[:10], current_file, category))

          print(f"COMMITS_SCANNED={len(commits)}")
          if findings:
              print(f"FINDINGS={len(findings)}")
              for sha, path, category in sorted(findings):
                  print(f"{category}\t{sha}\t{path}")
              sys.exit(1)

          print("FINDINGS=0")
          PY
