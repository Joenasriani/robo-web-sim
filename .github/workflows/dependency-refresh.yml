name: Dependency Refresh

on:
  push:
    branches:
      - chore/open-source-readiness

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[dependency-refresh]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Upgrade patched framework versions
        run: npm install next@16.4.0 eslint-config-next@16.4.0 --save-exact

      - name: Apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate
        run: |
          npm run lint
          npm test -- --runInBand
          npm run build

      - name: Commit dependency metadata
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency metadata changes."
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "Update dependencies for open-source release [dependency-refresh]"
          git push origin "HEAD:${BRANCH}"
