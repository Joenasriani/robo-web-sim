name: Bug report
description: Report a reproducible RoboWebSim problem
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail to reproduce it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Load ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS/device, and whether you used the hosted simulator or a local build.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recordings, or logs
      description: Add non-sensitive evidence that helps reproduce the problem.
